<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ルーレット</title>
  <meta name="description" content="コインを賭けて遊ぶヨーロピアン・ルーレット">
  <meta name="theme-color" content="#0e121a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,500..700&family=IBM+Plex+Mono:wght@400;500;600&family=Shippori+Mincho+B1:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="mark">
        <h1 class="wordmark">Roulette</h1>
        <p class="mark-sub">Européenne · 0–36</p>
      </div>
      <dl class="purse" aria-live="polite">
        <div class="purse-item">
          <dt>手持ち</dt>
          <dd><span id="balance">1000</span><span class="delta" id="delta" aria-hidden="true"></span></dd>
        </div>
        <div class="purse-item">
          <dt>賭け</dt>
          <dd id="staked">0</dd>
        </div>
      </dl>
    </header>

    <main class="app">
      <section class="stage" aria-label="ルーレット盤">
        <div class="wheel-wrap" id="wheelWrap">
          <canvas id="scene" aria-label="3Dルーレット盤。クリックでスピン"></canvas>
          <div class="coin-layer" id="coinLayer" aria-hidden="true"></div>
          <div class="announce" id="announce" aria-hidden="true" hidden>
            <span class="medal" id="announceNum"></span>
            <span class="announce-line" id="announceSub"></span>
          </div>
          <p class="fallback" id="fallback" hidden>このブラウザでは3D表示ができません。</p>
        </div>

        <div class="deck">
          <div class="call" role="status" aria-live="polite">
            <p class="call-ja" id="resultText">チップを置いて、スピンを押してください</p>
          </div>
          <button type="button" class="spin" id="spinBtn">スピン</button>
        </div>

        <div class="controls">
          <label class="slider" for="wheelSpeed">
            <span class="slider-head"><span>盤の回転</span><output id="wheelOut"></output></span>
            <input type="range" id="wheelSpeed" min="0" max="0.6" step="0.05" value="0.15">
          </label>
          <label class="slider" for="ballSpeed">
            <span class="slider-head"><span>ボールの射出</span><output id="ballOut"></output></span>
            <input type="range" id="ballSpeed" min="1" max="6" step="0.5" value="3">
          </label>
          <button type="button" class="sound" id="soundBtn" aria-pressed="true"></button>
        </div>
      </section>

      <section class="table" aria-labelledby="tableTitle">
        <div class="table-head">
          <h2 id="tableTitle">テーブル</h2>
          <p class="odds">数字 35:1 · 列・ダズン 2:1 · 赤黒・偶奇・前後半 1:1</p>
        </div>

        <div class="chips" id="chips" role="radiogroup" aria-label="置くチップの額"></div>

        <div class="baize">
          <div class="grid" id="grid"></div>
        </div>

        <div class="bet-actions">
          <button type="button" class="act" id="undoBtn">ひとつ戻す</button>
          <button type="button" class="act" id="clearBtn">全部戻す</button>
          <button type="button" class="act" id="rebetBtn">前回と同じ</button>
          <button type="button" class="act refill" id="refillBtn" hidden>1000枚を補充</button>
        </div>
        <p class="hint" id="hint">マスをタップすると、選んだチップが置かれます。右クリックでそのマスの賭けを戻せます。</p>

        <div class="marquee-head">
          <h2>出目</h2>
          <span class="marquee-stats" id="historyStats"></span>
        </div>
        <div class="marquee-wrap">
          <ol class="marquee" id="history"></ol>
          <p class="marquee-empty" id="historyEmpty">スピンすると、ここに出目が並びます</p>
        </div>
      </section>
    </main>
  </div>

  <noscript><p class="noscript">このページはJavaScriptが必要です。</p></noscript>
  <script src="lib/three.min.js?v=r128"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
